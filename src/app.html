<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="%%TITLE%%">
<link rel="manifest" href="%%MANIFEST%%">
<link rel="apple-touch-icon" href="%%ICON%%">
<title>%%TITLE%%</title>
<style>
:root{--g1:#12b886;--g2:#15aabf;--w1:#fab005;--w2:#fd7e14;--b1:#fa5252;--b2:#e64980;--bg:#f3f1fb;--card:#fff;--tx:#1b1b1d;--mu:#6b6b70;--ln:#e6e3dc;--ac:#6741d9;--ac2:#efe9ff;--in:#1d4ed8;--in2:#e5ecfb;--bad:#c2410c;--bad2:#fdeee6;--warn:#a16207;--warn2:#fbf3dc;--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#121019;--card:#1d1a26;--tx:#eceeed;--mu:#9aa09e;--ln:#2b2f2e;--ac:#9775fa;--ac2:#271f3d;--in:#7ea2f7;--in2:#1b2440;--bad:#f0905f;--bad2:#3a231a;--warn:#e2b64e;--warn2:#342b15}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
body.quick{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 14px 6px}
.hrow{display:flex;align-items:center;gap:4px}.mrow{justify-content:center;gap:10px;margin-top:4px}
.ibtn{border:0;background:none;color:var(--tx);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;cursor:pointer;padding:0}
.ibtn:active{background:var(--card)}
.ibtn .bellx{display:none}.ibtn.off{color:var(--mu)}.ibtn.off .bellx{display:inline}
header h1{font-size:24px;margin:0;flex:1;letter-spacing:-.3px}
.mbtn{border:0;background:var(--card);border-radius:12px;padding:6px 12px;min-width:40px;font-size:18px}
.mlabel{font-weight:700;font-size:16px;min-width:140px;text-align:center}
.dot{width:20px;height:20px;border-radius:50%;background:var(--mu);display:inline-block;box-shadow:0 0 0 4px rgba(128,128,128,.15)}
.dot.ok{background:#22a06b;box-shadow:0 0 0 4px rgba(34,160,107,.2)}.dot.busy{background:#e0a100;animation:pulse 1s infinite}.dot.err{background:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.2)}
@keyframes pulse{50%{opacity:.4}}
main{padding:4px 14px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:0 1px 0 var(--ln)}
.card h2{font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:-.2px}
header h1{background:linear-gradient(90deg,#6741d9,#e64980);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border-radius:22px}
.hero{background:linear-gradient(135deg,#087f5b,#0b7285);color:#fff;position:relative;overflow:hidden;padding:18px 18px 16px}
.hero.warn{background:linear-gradient(135deg,#b45309,#c2410c)}.hero.bad{background:linear-gradient(135deg,#c92a2a,#a61e4d)}
.hero .sub,.hero .lbl{color:rgba(255,255,255,.95)}.hero .bar{background:rgba(255,255,255,.3)}.hero .bar i{background:#fff!important}
.hero .btn{background:rgba(255,255,255,.95);color:#2b2140}.hero .btn.in{background:rgba(0,0,0,.18);color:#fff}
.herotop{display:flex;align-items:flex-start;gap:10px}.herotop>div:first-child{flex:1;min-width:0}
.moni{flex:none;cursor:pointer}.moni svg{display:block}
.bubble{background:#fff;color:#2b2140;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;margin:10px 0 0;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bubble:before{content:"";position:absolute;right:34px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#fff}
.moni.angry svg{animation:wob .5s ease-in-out 3}@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.moni.happy svg{animation:hop 1.2s ease-in-out infinite}@keyframes hop{50%{transform:translateY(-4px)}}
.hero .lbl{font-size:14px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;margin:2px 0;font-variant-numeric:tabular-nums}

.sub{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--cc,var(--ac));border-radius:8px}
.bar.bad i{background:var(--bad)}.bar.warn i{background:var(--warn)}
.brow{padding:11px 0;border-top:1px solid var(--ln);cursor:pointer}.brow:first-of-type{border-top:0}
.brow .bt{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.bl{color:var(--g1);white-space:nowrap}.bl.warn{color:var(--warn)}.bl.bad{color:var(--bad)}
.brow .bar{margin:7px 0 4px;height:10px}.bs{font-size:12px;color:var(--mu)}
.bedit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;font-size:15px}.bedit .inp{flex:0 0 110px;text-align:right}
.bhint{font-size:13px;font-weight:600;margin:-4px 0 12px;padding:8px 12px;border-radius:12px;background:var(--ac2);color:var(--ac)}.bhint:empty{display:none}
.bhint.warn{background:var(--warn2);color:var(--warn)}.bhint.bad{background:var(--bad2);color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}
.row .ic{width:36px;height:36px;border-radius:12px;background:var(--icb,var(--bg));font-size:18px;display:grid;place-items:center;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--mu);font-size:13px}
.row .a{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.row .a small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.row.tap{cursor:pointer}.row.off{opacity:.45}
.pos{color:var(--in)}.neg{color:var(--tx)}
.badge{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--warn2);color:var(--warn);font-weight:600;margin-left:6px;vertical-align:1px}
.badge.in{background:var(--in2);color:var(--in)}
.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--ac);color:#fff;font-weight:600;width:100%;cursor:pointer}
.btn.in{background:var(--in)}
.btn.ghost{background:var(--bg);color:var(--tx)}
.btn.danger{color:var(--bad)}
.btn.small{padding:8px 12px;width:auto;font-size:14px;border-radius:11px}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.tip{border-left:4px solid var(--ac);padding:12px 14px;border-radius:12px;background:var(--ac2);margin:0 0 10px}
.tip.bad{border-color:var(--bad);background:var(--bad2)}.tip.warn{border-color:var(--warn);background:var(--warn2)}
.tip b{display:block;margin-bottom:3px}
.tip p{margin:0;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mu);gap:2px;padding:4px 2px;width:100%}
nav button span{font-size:21px;line-height:1}
nav button.on{color:var(--ac);font-weight:600}
nav .plus{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#845ef7,#e64980);margin-top:-34px;border:6px solid var(--bg);box-shadow:0 8px 20px rgba(132,94,247,.4);display:flex;justify-content:center;align-items:center;padding:0;transition:transform .12s}
nav .plus svg{display:block}
nav .plus:active{transform:scale(.9)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}.sheet{overscroll-behavior:none}.sheet-card{overscroll-behavior:contain}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet-card{position:relative;background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.sheet-card .btns{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));z-index:2;background:var(--card);margin:0 -16px calc(-18px - env(safe-area-inset-bottom));padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 12px -4px var(--card)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-card.entry{display:flex;flex-direction:column;overflow:hidden;max-height:calc(100dvh - env(safe-area-inset-top) - 10px);padding-top:14px}
.sheet-card.entry>*{flex:none}
.sheet-card.entry .xbtn{position:absolute;top:14px;right:14px;margin:0;float:none}
.sheet-card.entry .xbtn+.seg,.sheet-card.entry .xbtn+h3{margin-right:46px}
.entry .amt{font-size:40px;line-height:1.1;padding:2px 0 8px}
.entry .chips{gap:5px;margin-bottom:8px}.entry .chip{padding:5px 9px;font-size:13px}
.entry .bhint{margin:-2px 0 8px;padding:6px 10px}
.entry .seg{margin-bottom:8px}.entry .seg button{padding:7px}
.entry .pad{flex:0 1 250px;min-height:136px;grid-template-rows:repeat(4,1fr);gap:6px;margin-bottom:8px}
.entry .pad button{padding:0;font-size:22px}
.entry .two{margin-bottom:8px}
.sheet-card.entry .btns{position:static;margin:0;padding:0;box-shadow:none;background:none}
.xbtn{position:sticky;top:0;float:right;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);color:var(--mu);font-size:16px;margin:-6px -4px 0 8px;cursor:pointer}
.sheet-card h3,.qwrap h3{margin:0 0 10px;font-size:18px}
label.f{display:block;font-size:13px;color:var(--mu);margin:0 0 10px}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);font-size:16px;color:var(--tx);font-weight:500}
::placeholder{color:var(--mu);opacity:.55;font-weight:400;font-style:italic}
.missing{border-color:#fa5252!important;box-shadow:0 0 0 3px rgba(250,82,82,.25)}
.misstxt{color:#fa5252;font-size:13px;font-weight:600;margin:-4px 0 10px}
textarea{min-height:160px;font-family:ui-monospace,Menlo,monospace!important;font-size:14px!important}
.hint{font-size:12px;color:var(--mu);margin:-4px 0 10px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.in button.on{color:var(--in)}
.amt{font-size:46px;font-weight:700;text-align:center;padding:4px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.amt.in{color:var(--in)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--ln);background:var(--bg);border-radius:20px;padding:7px 11px;font-size:14px;cursor:pointer}
.chip.on{background:var(--cc,var(--ac));border-color:var(--cc,var(--ac));color:#fff}
.chips.in .chip.on{background:var(--in);border-color:var(--in)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.pad button{border:0;background:var(--bg);border-radius:14px;padding:14px 0;font-size:24px;font-weight:500;cursor:pointer}
.pad button:active{background:var(--ln)}
.two{display:flex;gap:8px;margin-bottom:10px}.two>*{flex:1;min-width:0}
.qwrap{padding:14px 16px;max-width:520px;margin:0 auto}
.done{text-align:center;padding:40px 10px}
.done .chk{font-size:60px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{color:var(--mu);text-align:center;padding:18px 0;font-size:14px}
.day{font-size:13px;color:var(--mu);font-weight:600;margin:14px 2px 4px}
.mini{font-size:13px;color:var(--mu)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--bg);padding:8px;border-radius:10px;margin:6px 0}
.sw{position:relative;width:52px;height:32px;flex:none}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:var(--ln);border-radius:20px;transition:.2s}.sw span:before{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw input:checked+span{background:#22a06b}.sw input:checked+span:before{transform:translateX(20px)}
.shake{animation:sh .3s}
.seg.plan{margin:0 0 12px}
.hchart{display:flex;gap:6px;align-items:stretch;height:150px;margin:8px 0 2px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.hplot{position:relative;flex:1;width:100%}
.hzero{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}
.hbar{position:absolute;left:50%;transform:translateX(-50%);width:min(70%,34px);background:var(--g1);border-radius:4px 4px 0 0}
.hbar.neg{background:var(--bad);border-radius:0 0 4px 4px}.hbar.run{opacity:.45}
.hlab{font-size:11px;color:var(--mu);margin-top:4px;white-space:nowrap}.hlab.run{margin-top:0;font-size:10px}
.htab{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;margin-top:12px;border-top:1px solid var(--ln);padding-top:10px}
.htab .hd{font-size:12px;color:var(--mu)}.htab .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.negv{color:var(--bad)}
.dsum .dbig{font-size:30px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:2px 0 4px}.dsum .sub{margin-top:2px}.dsum{margin-bottom:6px}
.trend{font-size:12px;font-weight:700;margin-left:6px}.trend.up{color:var(--bad)}.trend.down{color:var(--g1)}
.inbox{border:2px solid color-mix(in srgb,var(--ac) 45%,transparent)}.inbox .row .a{margin-right:2px}
.ixbtn{flex:none;width:44px;height:44px;margin:-6px -8px -6px 0;border:0;background:none;color:var(--mu);font-size:15px;border-radius:50%;cursor:pointer}.ixbtn:active{background:var(--bg)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Normale iPhones (kleine Seite des Bildschirms max. 440px, per JS als html.phone markiert): quer nur Hinweis zum Zurückdrehen */
#rot{display:none}
@media (orientation:landscape){html.phone #rot{display:flex;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
  html.phone #rot p{margin:0;font-size:18px;font-weight:700}html.phone #rot .mini{font-weight:400}}
/* ===== Große Bildschirme (z. B. iPhone Duo). Normale iPhones sind quer höchstens 440px hoch und hoch höchstens 440px breit – für sie greift nichts davon. ===== */
/* Kopfzeile einzeilig, sobald Platz da ist (spart Höhe im Querformat) */
@media (min-width:600px) and (min-height:441px){
  header{display:flex;align-items:center;gap:4px;padding:6px max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left))}
  header>.hrow:first-child{display:contents}
  header h1{flex:none;order:0}
  header .mrow{order:1;flex:1;margin:0}
  header .ibtn{order:2}
}
/* Quer mit wenig Höhe (z. B. Duo zugeklappt quer): Eintragen links Betrag + Kategorien, rechts Tastenfeld */
@media (orientation:landscape) and (min-height:441px) and (max-height:499.98px){
  .sheet-card.entry{max-width:none;height:calc(100dvh - env(safe-area-inset-top) - 8px);max-height:none;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .qwrap:has(>#pad){max-width:none;height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))!important}
  :is(.sheet-card.entry,.qwrap:has(>#pad)){display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:20px;
    grid-template-rows:auto auto minmax(0,auto) auto auto auto auto 1fr auto;
    grid-template-areas:"ty x" "amt pad" "cats pad" "hint pad" "who pad" "fl pad" "form pad" "sp pad" "note btns"}
  .qwrap:has(>#pad){grid-template-areas:"ty pad" "amt pad" "cats pad" "hint pad" "who pad" "fl pad" "form pad" "sp pad" "note btns"}
  .sheet-card.entry>.xbtn{grid-area:x;position:static;justify-self:end;align-self:start;margin:0}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>:is(h3,.seg:not(#who):not(#forM)){grid-area:ty;margin:0 0 8px}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>#amt{grid-area:amt;font-size:38px;padding:0 0 6px}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>#cats{grid-area:cats;min-height:0;overflow:auto;align-content:flex-start;margin:0 0 8px;overscroll-behavior:contain}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>#bHint{grid-area:hint}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>#who{grid-area:who;margin:0 0 8px!important}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>.mini{grid-area:fl}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>#forM{grid-area:form;margin:0 0 8px!important}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>.two{grid-area:note;margin:0;align-self:end}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>#pad{grid-area:pad;min-height:0;height:auto;margin:0 0 8px;grid-template-rows:repeat(4,1fr);gap:7px}
  :is(.sheet-card.entry,.qwrap:has(>#pad))>.btns{grid-area:btns;align-self:end;position:static;margin:0;padding:0;box-shadow:none;background:none}
}
/* Breit und hoch genug (z. B. Duo aufgeklappt): Startseite in Spalten */
@media (min-width:600px) and (min-height:500px){
  main.wide{max-width:1180px;padding:4px max(10px,env(safe-area-inset-right)) 20px max(10px,env(safe-area-inset-left))}
  .cols{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:10px;align-items:start}
  .cols .card{padding:14px 13px;margin-bottom:10px}
  .cols .hero{padding:15px 14px 13px}
  .cols .hero .lbl,.cols .hero .sub{font-size:13px}
  .cols .brow .bt{font-size:14px}
  .cols .hero .big{font-size:32px;letter-spacing:-.8px}
  .cols .herotop{gap:8px}
  .cols .moni svg{width:66px;height:66px}
}
/* Sehr breit (z. B. Duo aufgeklappt quer): drei Spalten, Fenster schweben mittig */
@media (min-width:860px) and (min-height:500px){
  .cols.c3{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr)}
  .sheet{align-items:center;padding:20px}
  .sheet-card{max-width:520px;max-height:calc(100dvh - 40px);border-radius:24px;padding-bottom:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .sheet-card .btns{bottom:-18px;margin:0 -16px -18px;padding:10px 16px 18px}
  .sheet-card.entry{max-width:540px;max-height:calc(100dvh - 40px)}
  @keyframes up{from{transform:scale(.96);opacity:.4}}
}
</style>
</head>
<body>
<header id="hdr">
  <div class="hrow"><h1>Finanzen</h1>

  <button class="ibtn" id="bell" data-act="bell" aria-label="Benachrichtigungen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><path class="bellx" d="M3 3l18 18"/></svg></button>

<script>
'use strict';

const VAPID_PUB='BF92sPOMUkh7IMZ0Ecpq43OeBGYEC860P7MOFO9q8eJB1jklNmRqtSkiWFLy1lS6Qw1sp7NqywyLLthMWQaKYrs';

const REC_CATS=['Wohnen','Kredit & Schulden','Versicherung','Auto','Abos & Verträge','Familie','Steuern & Gebühren','Gesundheit','Sonstiges'];

/* ---------- Daten ---------- */
function arr(a){return Array.isArray(a)?a:[]}

  recurring:arr(d.recurring),expenses:arr(d.expenses),incomes:arr(d.incomes),debts:arr(d.debts),subs:arr(d.subs),carries:arr(d.carries),wishes:arr(d.wishes)}}
function mergeList(a,b){const m=new Map();for(const x of [...arr(a),...arr(b)]){if(!x||!x.id)continue;const y=m.get(x.id);if(!y||(x.updatedAt||'')>(y.updatedAt||''))m.set(x.id,x)}return[...m.values()].sort((x,y)=>x.id<y.id?-1:1)}
function merge(l,r){return{version:1,settings:(l.settings.updatedAt||'')>=(r.settings.updatedAt||'')?l.settings:r.settings,
  recurring:mergeList(l.recurring,r.recurring),expenses:mergeList(l.expenses,r.expenses),incomes:mergeList(l.incomes,r.incomes),debts:mergeList(l.debts,r.debts),subs:mergeList(l.subs,r.subs),carries:mergeList(l.carries,r.carries),wishes:mergeList(l.wishes,r.wishes)}}

let data=normalize(ls('fin.data'));
let cfg=Object.assign({owner:'',repo:'',path:'data.json',token:'',me:'',lang:'de'},ls('fin.cfg')||{});
const EN=()=>cfg.lang==='en';
MONTHS=EN()?MONTHS_EN:MONTHS_DE;
let curMonth=todayYM(),view='home',listWho='';
const people=()=>data.settings.people||[];
const members=()=>[...new Set([...people(),...(data.settings.extraMembers||[])])];
const forLbl=r=>r.forWhom&&r.forWhom!=='Alle'?r.forWhom:'Alle';
let fixSort=ls('fin.fixSort')||'due',fixGroup=ls('fin.fixGroup')||'interval';
function saveLocal(){_cc={};ls('fin.data',data)}
function saveCfg(){ls('fin.cfg',cfg)}
function upsert(kind,rec){rec.updatedAt=now();const a=data[kind];const i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);changed()}
function remove(kind,id){const x=data[kind].find(x=>x.id===id);if(x){x.deleted=true;x.updatedAt=now();changed()}}

let syncTimer;function changed(){saveLocal();render();clearTimeout(syncTimer);syncTimer=setTimeout(sync,700)}
const cats=()=>data.settings.cats;
const catIcon=n=>(cats().find(c=>c[1]===n)||['📦'])[0];
const catBudget=n=>+(cats().find(c=>c[1]===n)||[])[2]||0;
function budgetInfo(m,cat,skipId){const lim=catBudget(cat);if(!lim)return null;const spent=sum(live(data.expenses).filter(e=>e.cat===cat&&e.date.startsWith(m)&&e.id!==skipId));return{lim,spent,left:lim-spent}}
function budgetLine(m,cat){const b=budgetInfo(m,cat);if(!b)return '';return b.left>=0?`${catIcon(cat)} ${cat}: noch ${eur(b.left)} übrig`:`${catIcon(cat)} ${cat}: ${eur(-b.left)} über Budget`}
const recIn=()=>live(data.recurring).filter(r=>r.kind==='in');
function inSources(){const s=[IN_SRC_FIXED[0]];for(const r of recIn())if(!s.some(x=>x[1]===r.name))s.push(['🔁',r.name]);return s.concat(IN_SRC_FIXED.slice(1))}

/* ---------- Termine ---------- */
function dueIn(r,m){const s=mi(r.start.slice(0,7)),t=mi(m);if(t<s)return false;if(r.end&&t>mi(r.end))return false;const n=ivN(r);if(n===0)return t===s;return(t-s)%n===0}
function dueDate(r,m){const day=+r.start.slice(8,10)||1;const[y,mo]=m.split('-').map(Number);const last=new Date(y,mo,0).getDate();return `${m}-${pad2(Math.min(day,last))}`}
function reserveActive(r,m){const n=ivN(r);if(n<2)return false;const s=mi(r.start.slice(0,7)),t=mi(m);if(r.end&&t>mi(r.end))return false;return t>s-n}
function nextDue(r,from=todayISO()){const f=mi(from.slice(0,7));for(let i=f;i<f+30;i++){const m=ymOf(i);if(dueIn(r,m)){const d=dueDate(r,m);if(d>=from)return d}}return null}
function upcoming(days){const out=[],t=todayISO(),end=new Date(Date.now()+days*864e5).toISOString().slice(0,10);const f=mi(t.slice(0,7)),l=mi(end.slice(0,7));
  for(const r of live(data.recurring)){if(r.kind==='in')continue;for(let i=f;i<=l;i++){const m=ymOf(i);if(dueIn(r,m)){const d=dueDate(r,m);if(d>=t&&d<=end)out.push({r,d})}}}
  return out.sort((a,b)=>a.d<b.d?-1:1)}

/* ---------- Startmonat ---------- */
function startMonth(){if(data.settings.startMonth)return data.settings.startMonth;const ms=[todayYM(),...live(data.expenses).map(e=>e.date.slice(0,7)),...live(data.incomes).map(incMonth)];return ms.sort()[0]}
/* ---------- Übertrag ---------- */
let _cc={};
function baseMonth(){const e=live(data.expenses);if(!e.length)return null;const b=e.reduce((a,x)=>x.date<a?x.date:a,'9999').slice(0,7);return b<startMonth()?startMonth():b}
const carryDecision=p=>live(data.carries).find(x=>x.month===p);
function carryIn(m){if(m in _cc)return _cc[m];_cc[m]=0;const p=ymOf(mi(m)-1),b=baseMonth();let v=0;
  if(b&&p>=b&&p<todayYM()&&mi(m)-mi(b)<60&&hasSalary(p)){const a=calc(p).avail;const d=carryDecision(p);if(a<0)v=a;else if(d&&d.choice==='carry')v=a}
  _cc[m]=Math.round(v*100)/100;return _cc[m]}
/* ---------- Monatsrechnung ---------- */
function calc(m){
  let fixed=0,reserve=0,once=0,dueRare=0;const L=live(data.recurring);
  for(const r of L){if(r.kind==='in')continue;const n=ivN(r);
    if(n===1){if(dueIn(r,m))fixed+=r.amount}
    else if(n===0){if(dueIn(r,m))once+=r.amount}
    else{if(reserveActive(r,m))reserve+=r.amount/n;if(dueIn(r,m))dueRare+=r.amount}}
  // Einnahmen: Plan pro Quelle, ersetzt durch tatsächliche Buchungen
  const inc=live(data.incomes).filter(x=>incMonth(x)===m);
  const plan=[];
  for(const r of L)if(r.kind==='in'&&dueIn(r,m))plan.push([r.name,r.amount]);
  let income=0,incomeActual=0,incomePlanned=0;const srcRows=[];
  for(const[name,amt]of plan){const got=inc.filter(x=>x.source===name);if(got.length){const v=sum(got);income+=v;incomeActual+=v;srcRows.push([name,v,true])}else{income+=amt;incomePlanned+=amt;srcRows.push([name,amt,false])}}
  const hasSal=inc.some(x=>x.source==='Gehalt');
  const extra=inc.filter(x=>!plan.some(p=>p[0]===x.source));const ex=sum(extra);income+=ex;incomeActual+=ex;
  for(const x of extra){const r=srcRows.find(s=>s[0]===x.source);if(r)r[1]+=x.amount;else srcRows.push([x.source,x.amount,true])}
  const goal=+data.settings.savingsGoal||0;
  const exp=live(data.expenses).filter(e=>e.date.startsWith(m));const spent=sum(exp);
  const carry=carryIn(m);
  const budget=income-fixed-reserve-once-goal+carry;const avail=budget-spent;
  const t=todayYM();let daysLeft=0;const[y,mo]=m.split('-').map(Number);const last=new Date(y,mo,0).getDate();
  if(m===t)daysLeft=last-new Date().getDate()+1;else if(m>t)daysLeft=last;
  const byCat={};for(const e of exp)byCat[e.cat]=(byCat[e.cat]||0)+e.amount;
  return{hasSal,carry,income,incomeActual,incomePlanned,srcRows,fixed,reserve,once,dueRare,goal,spent,budget,avail,daysLeft,byCat,exp}}

const incMonth=x=>x.forMonth||x.date.slice(0,7);
function lastWorkday(m){const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo,0);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return `${m}-${pad2(d.getDate())}`}
function salaryDueMonth(){const t=todayISO(),m=t.slice(0,7);if(t>=lastWorkday(m))return ymOf(mi(m)+1);if(+t.slice(8)<=5)return m;return null}
const hasSalary=m=>live(data.incomes).some(x=>x.source==='Gehalt'&&incMonth(x)===m);
/* ---------- Schulden ---------- */
function payoff(bal,rate,pay){const r=(+rate||0)/1200;bal=+bal||0;pay=+pay||0;if(bal<=0)return{months:0,interest:0};if(pay<=bal*r+0.01)return null;let m=0,int=0,b=bal;while(b>0.005&&m<720){const i=b*r;int+=i;b=b+i-pay;m++}return{months:m,interest:int}}
const inMonths=n=>monthName(ymOf(mi(todayYM())+n));

/* ---------- Tipps ---------- */
function tips(){
  const T=[],c=calc(curMonth),m=curMonth,L=live(data.recurring).filter(r=>r.kind!=='in');
  if(!c.hasSal)T.push(['warn',`Gehalt für ${monthName(m)} fehlt`,'Trag es über + → Einnahme → Gehalt ein. Bis dahin kann die App nicht ehrlich rechnen, was übrig bleibt.']);
  if(!c.hasSal){}else if(c.avail<0)T.push(['bad',`${eur(-c.avail)} über Plan`,'Diesen Monat ist mehr raus als geplant. Bis Monatsende nur noch das Nötigste – und schau in „Buchungen“, welche Kategorie ausgerissen ist.']);
  else if(c.daysLeft>0&&c.avail/c.daysLeft<15&&c.income>0)T.push(['warn','Wird eng',`Nur noch ${eur(c.avail/c.daysLeft)} pro Tag. Größere Käufe lieber auf nächsten Monat schieben.`]);
  const fixShare=c.hasSal&&c.income>0?(c.fixed+c.reserve)/c.income:0;
  if(fixShare>.65)T.push(['warn',`${Math.round(fixShare*100)} % sind fest verplant`,'Ab ca. 50–60 % wird es schnell eng. Die größten Hebel sind meist Kredite, Leasing und Versicherungen – nicht der Kaffee unterwegs.']);
  if(c.reserve>0){const nx=upcoming(120).find(u=>ivN(u.r)>1);
    T.push(['',`Rücklage: ${eur(Math.ceil(c.reserve))} pro Monat zur Seite`,`Die App hält das Geld schon für euch zurück – einfach nicht ausgeben. ${live(data.debts).some(d=>/dispo/i.test(d.name)&&(+d.balance||0)>0)?'Solange ihr im Dispo seid, lasst es auf dem Girokonto: das spart Dispo-Zinsen. Ein Extra-Konto lohnt sich erst danach.':'Am besten per Dauerauftrag auf ein Extra-Konto (z. B. Tagesgeld), damit es nicht aus Versehen weg ist.'}${nx?` Nächste: ${esc(nx.r.name)} am ${fmtDate(nx.d)} (${eur(nx.r.amount)}).`:''}`])}
  else if(L.length)T.push(['warn','Keine Jahres- oder Quartalskosten eingetragen','Genau die werden gern vergessen. Unter „Fixkosten“ gibt es eine Liste der Klassiker zum Durchgehen.']);
  const debts=live(data.debts).filter(d=>(+d.balance||0)>0).sort((a,b)=>b.rate-a.rate);
  if(debts.length){const top=debts[0];const intM=debts.reduce((s,d)=>s+d.balance*d.rate/1200,0);
    T.push(['',`Teuerste Schuld zuerst: ${esc(top.name)} (${String(top.rate).replace('.',',')} %)`,`Deine Schulden kosten zusammen ca. ${eur(intM)} Zinsen pro Monat. Jeder Extra-Euro bringt am meisten, wenn er auf den höchsten Zinssatz geht.`]);
    const disp=debts.find(d=>/dispo/i.test(d.name));if(disp&&disp.rate>=8)T.push(['warn',`Dispo: ${eur(disp.balance*disp.rate/1200)} Zinsen im Monat`,'Ein Ratenkredit zu deutlich niedrigerem Zins kann sich lohnen – aber nur, wenn der Dispo danach nicht wieder vollläuft. Am besten den Dispo-Rahmen danach senken lassen.']);
    const tgt=debts.find(d=>(+d.payment||0)>0);
    const ending=L.filter(r=>r.end&&ivN(r)===1&&mi(r.end)>=mi(todayYM())&&mi(r.end)<=mi(todayYM())+3);
    for(const r of ending){if(!tgt)break;const a=payoff(tgt.balance,tgt.rate,tgt.payment),b=payoff(tgt.balance,tgt.rate,(+tgt.payment)+r.amount);
      if(a&&b)T.push(['',`${esc(r.name)} fällt nach ${monthName(r.end)} weg`,`Wenn ihr die ${eur(r.amount)} danach direkt zusätzlich auf ${esc(tgt.name)} zahlt: schuldenfrei in ca. ${b.months} statt ${a.months} Monaten und rund ${eur0(a.interest-b.interest)} weniger Zinsen.`])}
    if(!c.goal)T.push(['','Feste Extra-Tilgung festlegen','Trag unter ⚙︎ einen Betrag „Sparen / Extra-Tilgung“ ein. Dann zieht die App ihn jeden Monat automatisch ab und ihr gebt ihn nicht aus Versehen aus.'])}
  // Kategorien vs. Schnitt
  const prev=[1,2,3].map(i=>ymOf(mi(m)-i));
  for(const [,cat] of cats()){const vals=prev.map(p=>sum(live(data.expenses).filter(e=>e.cat===cat&&e.date.startsWith(p)))).filter(v=>v>0);if(vals.length<2)continue;
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;const cur=c.byCat[cat]||0;if(cur>avg*1.15&&cur-avg>25)T.push(['warn',`${catIcon(cat)} ${esc(cat)}: ${eur(cur)}`,`Sonst im Schnitt ${eur(avg)} – du liegst schon ${eur(cur-avg)} drüber.`])}
  for(const [ic,cat,lim] of cats()){const l=+lim||0;if(!l)continue;const cur=c.byCat[cat]||0;
    if(cur>l)T.push(['bad',`${ic} ${esc(cat)}: Budget überschritten`,`${eur(cur)} von ${eur(l)}.`]);else if(cur>l*.8)T.push(['warn',`${ic} ${esc(cat)}: ${Math.round(cur/l*100)} % vom Budget`,`Noch ${eur(l-cur)} übrig.`])}
  const food=(c.byCat['Essen & Lieferdienst']||0);if(c.spent>100&&food/c.spent>.15)T.push(['warn','Essen gehen & Lieferdienst',`${Math.round(food/c.spent*100)} % eurer Ausgaben. Zweimal die Woche vorkochen und Lieferdienst nur am Wochenende spart schnell 80–150 € im Monat.`]);
  const small=c.exp.filter(e=>e.amount<10);if(small.length>=10)T.push(['',`${small.length} Kleinkäufe unter 10 €`,`Zusammen ${eur(sum(small))}. Einzeln fällt das nicht auf – in Summe schon.`]);
  const abos=L.filter(r=>r.cat==='Abos & Verträge');if(abos.length){const y=abos.reduce((s,r)=>s+(ivN(r)?r.amount*12/ivN(r):0),0);

/* ---------- Sync über GitHub ---------- */
function b64e(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64d(x){const s=atob(x.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0)))}
const hasRemote=()=>cfg.token&&cfg.owner&&cfg.repo;
function api(path,opt={}){return fetch('https://api.github.com'+path,Object.assign({cache:'no-store'},opt,{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}))}
const fileUrl=()=>`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${(cfg.path||'data.json').split('/').map(encodeURIComponent).join('/')}`;
let syncing=false,again=false,syncState='local',syncMsg='';
function setSync(s,msg=''){syncState=s;syncMsg=msg;const d=$('#dot');if(d)d.className='dot '+({ok:'ok',busy:'busy',err:'err'}[s]||'');const e=$('#syncInfo');if(e)e.textContent=syncText()}
function syncText(){return{local:'Nur auf diesem Gerät (nicht verbunden)',busy:'Synchronisiere …',ok:'Synchron ✓ '+(ls('fin.lastSync')?new Date(ls('fin.lastSync')).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''),err:'Fehler: '+syncMsg}[syncState]}
async function sync(){
  if(!hasRemote()){setSync('local');return}
  if(syncing){again=true;return}
  syncing=true;setSync('busy');
  try{
    let done=false;
    for(let i=0;i<4&&!done;i++){
      const g=await api(fileUrl());let remote=normalize({}),sha;
      if(g.status===200){const j=await g.json();sha=j.sha;remote=normalize(JSON.parse(b64d(j.content)))}
      else if(g.status===401)throw new Error('Token ungültig oder abgelaufen');
      else if(g.status!==404)throw new Error('GitHub antwortet '+g.status);
      const merged=merge(data,remote);
      const before=JSON.stringify(data);data=merged;saveLocal();if(JSON.stringify(data)!==before)render();
      if(sha&&JSON.stringify(merged)===JSON.stringify(merge(remote,remote))){done=true;break}
      const p=await api(fileUrl(),{method:'PUT',body:JSON.stringify({message:`Update von ${cfg.me||'App'}`,content:b64e(JSON.stringify(merged,null,1)),sha})});
      if(p.ok){done=true;break}
      if(p.status===409||p.status===422)continue;
      if(p.status===404||p.status===403)throw new Error('Kein Schreibrecht – Token braucht „Contents: Read and write“ für dieses Repo');
      throw new Error('Speichern fehlgeschlagen ('+p.status+')')}
    if(!done)throw new Error('Konflikt, versuche es gleich nochmal');
    ls('fin.lastSync',Date.now());setSync('ok');if(!QUICK){askMe();askCarry();askSalary();loadInbox()}
  }catch(e){setSync('err',e.message||'Keine Verbindung')}
  syncing=false;if(again){again=false;sync()}}
/* ---------- Apple-Pay-Eingang ----------
   Ein Kurzbefehl (Automation „Transaktion“) legt bei jeder Apple-Pay-Zahlung still eine Datei inbox/<name>.json
   ins Daten-Repo: {"amount":"12,34 €","merchant":"Laden","who":"Name","date":"2026-01-31T12:00:00+01:00"}.
   Kiko zeigt sie auf der Startseite; man wählt selbst die Kategorie. Gebucht wird mit der festen id „ap-<name>“,
   so entsteht auch bei zwei Handys keine doppelte Buchung. Danach wird die Datei gelöscht. */
let inbox=[],inboxBusy=false;
const inboxDir=()=>`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/inbox`;
const inboxId=n=>'ap-'+n.replace(/\.json$/i,'');
function parseInbox(name,txt){let j={};try{j=JSON.parse(txt)}catch(e){const g=k=>(txt.match(new RegExp('"'+k+'"\\s*:\\s*"([^"]*)"'))||[])[1];j={amount:g('amount'),merchant:g('merchant'),who:g('who'),date:g('date')}}
  const fd=name.match(/^(\d{4})(\d\d)(\d\d)/);
  const date=/^\d{4}-\d\d-\d\d/.test(String(j.date||''))?String(j.date).slice(0,10):fd?`${fd[1]}-${fd[2]}-${fd[3]}`:todayISO();
  return{name,amount:num(j.amount),merchant:String(j.merchant||'').trim(),who:String(j.who||'').trim(),date}}
function delInbox(f){return api(inboxDir()+'/'+encodeURIComponent(f.name),{method:'DELETE',body:JSON.stringify({message:'Apple-Pay-Zahlung erledigt',sha:f.sha})}).catch(()=>{})}
async function loadInbox(){if(!hasRemote()||inboxBusy)return;inboxBusy=true;
  try{const r=await api(inboxDir());
    if(r.ok){const files=(await r.json()).filter(f=>f.type==='file'&&/\.json$/i.test(f.name));
      const known=new Set(data.expenses.map(x=>x.id)),next=[];
      for(const f of files){if(known.has(inboxId(f.name))){delInbox(f);continue}
        const old=inbox.find(x=>x.name===f.name);if(old){old.sha=f.sha;next.push(old);continue}
        const g=await api(inboxDir()+'/'+encodeURIComponent(f.name));if(!g.ok)continue;const j=await g.json();
        next.push({...parseInbox(f.name,b64d(j.content)),sha:j.sha})}
      const ch=next.map(x=>x.name).join()!==inbox.map(x=>x.name).join();inbox=next;if(ch)render()}
    else if(r.status===404&&inbox.length){inbox=[];render()}
  }catch(e){}inboxBusy=false}
function inboxDone(name){const f=inbox.find(x=>x.name===name);inbox=inbox.filter(x=>x.name!==name);if(f)delInbox(f);render()}
function inboxCard(){if(!inbox.length)return '';
  return `<section class="card inbox"><h2>💳 Neu von Apple Pay</h2><p class="mini" style="margin:-4px 0 4px">Antippen und Kategorie wählen.</p>${inbox.map(x=>`<div class="row tap" data-act="inboxBook" data-id="${esc(x.name)}"><div class="ic">💳</div><div class="mid"><div class="t">${esc(x.merchant||'Apple Pay')}</div><div class="s">${fmtDate(x.date)}${x.who?' · '+esc(x.who):''}</div></div><div class="a">− ${eur(x.amount)}</div><button class="ixbtn" data-act="inboxSkip" data-id="${esc(x.name)}" aria-label="Ignorieren">✕</button></div>`).join('')}</section>`}
async function testConnection(){
  if(!hasRemote()){toast('Bitte Benutzer, Repo und Token eintragen');return}
  setSync('busy');
  try{const r=await api(`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`);
    if(r.status===401)throw new Error('Token ungültig');if(r.status===404)throw new Error('Repo nicht gefunden oder Token hat keinen Zugriff darauf');
    const j=await r.json();if(!j.private){setSync('err','Das Daten-Repo ist ÖFFENTLICH! Stell es auf privat, bevor du Daten speicherst.');return}
    toast('Verbindung klappt ✓');await sync()}catch(e){setSync('err',e.message)}}
function setupCode(){return btoa(unescape(encodeURIComponent(JSON.stringify({o:cfg.owner,r:cfg.repo,p:cfg.path,t:cfg.token}))))}
function applyCode(code){try{const j=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!j.t||!j.o||!j.r)throw 0;Object.assign(cfg,{owner:j.o,repo:j.r,path:j.p||'data.json',token:j.t});saveCfg();return true}catch(e){return false}}

function dumbReason(e,c){

  if(e.cat==='Essen & Lieferdienst'&&pd<25)return `Lieferdienst, obwohl nur noch ${eur(pd)} pro Tag drin sind? Ernsthaft?`;
  const dayBudget=c.budget>0?c.budget/30:0;
  if(dayBudget&&e.amount>dayBudget*3&&['Kleidung','Freizeit','Sonstiges','Essen & Lieferdienst'].includes(e.cat))return `Das sind ${Math.round(e.amount/dayBudget)} Tagesbudgets auf einmal! Musste das sein?`;
  if(h>=23||h<5)return `Einkauf um ${h} Uhr nachts? Nachts kauft man nur Quatsch.`;

  if(c.avail<0)return['angry',`Ihr seid ${eur(-c.avail)} drüber! Ab jetzt nur noch Nudeln mit Ketchup. 😠`];

function trCat(t){const m=t.match(/^(\S+\s)(.+)$/);if(m&&I18N_EXACT[m[2]]!=null)return m[1]+I18N_EXACT[m[2]];return I18N_EXACT[t]!=null?I18N_EXACT[t]:t}
function trStr(t){if(!EN()||!t||!/[A-Za-zÄÖÜäöüß]/.test(t))return t;const k=t.trim();if(I18N_EXACT[k]!=null)return t.replace(k,I18N_EXACT[k]);let o=t;for(const[re,rep]of I18N_RULES)o=o.replace(re,rep);return o}
function trNode(n){if(!EN())return;if(n.nodeType===3){const v=trStr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE'||n.tagName==='TEXTAREA')return;
  for(const a of['placeholder','aria-label','title']){if(n.hasAttribute&&n.hasAttribute(a)){const v=trStr(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}}
  if(n.tagName==='OPTION'){const v=trStr(n.textContent);if(v!==n.textContent)n.textContent=v;return}
  for(const c of n.childNodes)trNode(c)}

  <section class="card"><h2>🔔 Benachrichtigungen</h2><div class="row" style="border:0;padding:0"><div class="mid"><div class="t">Bei neuen Buchungen der anderen Person</div><div class="s">${pushPossible()?'Gilt nur für dieses Handy. Auch über die 🔔 oben ein- und ausschaltbar.':'Nur in der App vom Home-Bildschirm möglich (iOS 16.4+).'}</div></div><label class="sw"><input type="checkbox" id="sPush" ${pushOn()?'checked':''}><span></span></label></div></section>
  <section class="card"><h2>Planung</h2>
  <label class="f">Sparen / Extra-Tilgung pro Monat<input id="sGoal" inputmode="decimal" value="${s.savingsGoal?String(s.savingsGoal).replace('.',','):''}" placeholder="0"></label>
  <div class="hint">Wird jeden Monat vom frei verfügbaren Geld abgezogen.</div>
  <label class="f" style="margin-top:12px">Tracking ab Monat<select id="sStart">${(()=>{const ms=[todayYM(),...live(data.expenses).map(e=>e.date.slice(0,7)),...live(data.incomes).map(incMonth)].sort();const a=Math.min(mi(ms[0]),mi(todayYM())-12),b=mi(todayYM())+1,o=[];for(let i=b;i>=a;i--)o.push(ymOf(i));
    return `<option value="" ${!s.startMonth?'selected':''}>automatisch (erster Monat mit Daten)</option>`+o.map(m=>`<option value="${m}" ${m===s.startMonth?'selected':''}>${monthName(m)}</option>`).join('')})()}</select></label>
  <div class="hint">Alles davor wird ignoriert: kein Übertrag, nicht im Verlauf. Praktisch, wenn ihr mitten im Monat angefangen habt.</div></section>
  <section class="card"><h2>Kategorien & Budgets</h2><div class="hint" style="margin:0 0 8px">Eine pro Zeile: <b>Emoji Name | Budget</b> (Budget optional)</div>
  <textarea id="sCats" class="inp">${esc(s.cats.map(c=>`${c[0]} ${c[1]}${c[2]?' | '+c[2]:''}`).join('\n'))}</textarea><div style="margin-top:8px"><button class="btn small" id="saveCats">Kategorien speichern</button></div></section>
  <section class="card"><h2>Gemeinsam nutzen (GitHub)</h2>
  <div class="sub" style="margin-bottom:10px" id="syncInfo">${syncText()}</div>
  <label class="f">GitHub-Benutzername<input id="cOwner" value="${esc(cfg.owner)}" autocapitalize="off" autocorrect="off" placeholder="dein-github-name"></label>
  <label class="f">Privates Daten-Repo<input id="cRepo" value="${esc(cfg.repo)}" autocapitalize="off" autocorrect="off" placeholder="z. B. finanzen-daten"></label>
  <label class="f">Token<input id="cTok" type="password" value="${esc(cfg.token)}" autocapitalize="off" autocorrect="off" placeholder="github_pat_…"></label>
  <div class="btns"><button class="btn" id="cSave">Verbinden & testen</button><button class="btn ghost" data-act="syncNow">Sync</button></div>
  ${hasRemote()?`<div style="margin-top:16px"><b>Zweites Gerät einrichten</b><div class="hint" style="margin:4px 0 8px">Code kopieren, auf dem anderen Handy unter ⚙︎ → „Code einfügen“. Der Code enthält den Token – nur privat weitergeben (z. B. AirDrop), nicht posten.</div><div class="btns"><button class="btn small ghost" data-act="copyCode">📋 Code kopieren</button><button class="btn small ghost" data-act="copyLink">📋 Link kopieren</button></div></div>`:''}
  <div style="margin-top:16px"><b>Code einfügen</b><div class="two" style="margin-top:6px"><input class="inp" id="cCode" placeholder="Code vom anderen Gerät" autocapitalize="off"><button class="btn small" id="cApply" style="flex:none">OK</button></div></div></section>
  <section class="card"><h2>Daten</h2><div class="btns" style="flex-wrap:wrap"><button class="btn small ghost" data-act="export">⬇︎ Backup exportieren</button><label class="btn small ghost" style="text-align:center">⬆︎ Importieren<input type="file" id="imp" accept=".json,application/json" hidden></label></div>
  <div class="hint" style="margin-top:8px">Import ergänzt die vorhandenen Daten, nichts wird überschrieben.</div>
  <button class="btn small ghost danger" data-act="wipe" style="margin-top:6px">Daten auf diesem Gerät löschen</button></section>
  <p class="mini" style="text-align:center">Version ${VERSION}</p>`}
function mountSettings(){
  $('#sPush').onchange=e=>setPush(e.target.checked).then(render);
  $('#sMe').onchange=e=>{cfg.me=e.target.value;saveCfg();const x=mySub();if(x)upsert('subs',{...x,who:cfg.me});toast('Gespeichert')};
  $('#sExtra').onchange=e=>{setSettings({extraMembers:[...new Set(e.target.value.split(',').map(x=>x.trim()).filter(Boolean))]});toast('Gespeichert')};
  $('#sPeople').onchange=e=>{const p=[...new Set(e.target.value.split(',').map(x=>x.trim()).filter(Boolean))];setSettings({people:p});if(!cfg.me&&p.length){cfg.me=p[0];saveCfg()}toast('Gespeichert')};
  $('#sGoal').onchange=e=>{setSettings({savingsGoal:num(e.target.value)});toast('Gespeichert')};
  $('#sStart').onchange=e=>{const v=e.target.value;if(v&&curMonth<v)curMonth=v;setSettings({startMonth:v});toast('Gespeichert')};
  $('#saveCats').onclick=()=>{const c=$('#sCats').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[left,lim]=l.split('|');const m=left.trim().match(/^([^\p{L}\p{N}\s]+)\s*(.+)$/u);return[m?m[1]:'•',(m?m[2]:left).trim(),lim?String(num(lim)||''):'']});if(!c.length)return;setSettings({cats:c});toast('Kategorien gespeichert')};
  ['cOwner','cRepo','cTok'].forEach(id=>$('#'+id).addEventListener('input',e=>{e.target.classList.remove('missing');const n=e.target.parentElement.nextElementSibling;if(n&&n.classList.contains('misstxt'))n.remove()}));
  $('#cSave').onclick=()=>{const F=[['cOwner','Benutzername fehlt'],['cRepo','Repo-Name fehlt'],['cTok','Token fehlt']];let bad=0;
    document.querySelectorAll('.misstxt').forEach(x=>x.remove());
    for(const[id,msg]of F){const el=$('#'+id);if(!el.value.trim()){bad++;el.classList.add('missing');el.parentElement.insertAdjacentHTML('afterend',`<div class="misstxt">⚠︎ ${msg}</div>`)}}
    if(bad){toast('Bitte die rot markierten Felder ausfüllen');$('.missing').scrollIntoView({behavior:'smooth',block:'center'});return}
    cfg.owner=$('#cOwner').value.trim();cfg.repo=$('#cRepo').value.trim();cfg.token=$('#cTok').value.trim();saveCfg();testConnection().then(render)};
  $('#cApply').onclick=()=>{if(applyCode($('#cCode').value)){toast('Verbunden ✓');sync().then(render);render()}else toast('Code ungültig')};
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=normalize(JSON.parse(await f.text()));const keepS=data.settings.updatedAt?data.settings:d.settings;data=merge(data,d);if(!data.settings.updatedAt||keepS===d.settings)data.settings=Object.assign(d.settings,{updatedAt:now()});changed();toast('Importiert ✓')}catch(err){toast('Datei nicht lesbar')}}}

/* ---------- Formulare ---------- */
function entryForm(root,{type='out',id=null,pre={}},onDone){
  const isEdit=!!id;let rec=id?(data[type==='in'?'incomes':'expenses'].find(x=>x.id===id)):null;
  let who=rec?.who||(pre.who&&(!people().length||people().includes(pre.who))?pre.who:'')||cfg.me||people()[0]||'';
  const st={type,amt:rec?String(rec.amount).replace('.',','):(pre.amt||''),cat:rec?(type==='in'?rec.source:rec.cat):(pre.cat||'')};
  if(!st.cat&&!pre.pickCat)st.cat=type==='in'?'Gehalt':(ls('fin.lastCat')||cats()[0][1]);
  const defFor=d=>+d.slice(8)>=20?ymOf(mi(d.slice(0,7))+1):d.slice(0,7);
  const autoFor=()=>st.cat==='Gehalt'?defFor(todayISO()):todayISO().slice(0,7);let forTouched=!!(rec?.forMonth||pre.forMonth);
  st.forMonth=rec?.forMonth||pre.forMonth||autoFor();
  const draw=()=>{const IN=st.type==='in';const opts=IN?inSources():cats();
    root.innerHTML=(root.id==='sheetCard'?'<button class="xbtn" data-act="close" aria-label="Schließen">✕</button>':'')+`${isEdit?`<h3>${IN?'Einnahme':'Ausgabe'} bearbeiten</h3>`:`<div class="seg ${IN?'in':''}"><button data-ty="out" class="${IN?'':'on'}">− Ausgabe</button><button data-ty="in" class="${IN?'on':''}">+ Einnahme</button></div>`}
    <div class="amt ${IN?'in':''}" id="amt"></div>
    <div class="chips ${IN?'in':''}" id="cats">${opts.map(([i,n])=>`<button class="chip ${n===st.cat?'on':''}" style="--cc:${IN?'var(--in)':catColor(n)}" data-cat="${esc(n)}">${i} ${esc(n)}</button>`).join('')}</div>
    ${IN?'':'<div class="bhint" id="bHint"></div>'}
    ${people().length>1?`<div class="seg" id="who" style="margin-bottom:10px">${people().map(p=>`<button data-who="${esc(p)}" class="${p===who?'on':''}">${esc(p)}</button>`).join('')}</div>`:''}
    <div class="pad" id="pad">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
    ${IN?`<div class="mini" style="margin:0 0 4px">Gilt für welchen Monat?</div><div class="seg in" id="forM" style="margin-bottom:10px">${[-1,0,1].map(o=>ymOf(mi(todayISO().slice(0,7))+o)).filter(fm=>fm>=startMonth()||fm===st.forMonth).map(fm=>{return `<button data-for="${fm}" class="${fm===st.forMonth?'on':''}">${MONTHS[+fm.slice(5)-1]}</button>`}).join('')}</div>`:''}
    <div class="two"><input class="inp" id="note" placeholder="Notiz (optional)" value="${esc(rec?.note||pre.note||'')}"><input class="inp" id="date" type="date" value="${rec?rec.date:(pre.date||todayISO())}" style="flex:0 0 150px"></div>
    <div class="btns">${isEdit?'<button class="btn ghost danger" id="del">Löschen</button>':''}<button class="btn ${IN?'in':''}" id="save">${IN?'Einnahme speichern':'Speichern'}</button></div>`;
    const dt=$('#date');if(dt)dt.onchange=updB;upd()};
  const updB=()=>{const el=$('#bHint');if(!el)return;const b=st.type==='in'?null:budgetInfo(($('#date')?.value||todayISO()).slice(0,7),st.cat,rec?.id);
    if(!b){el.textContent='';el.className='bhint';return}const a=num(st.amt)||0,after=b.left-a;
    el.className='bhint '+(after<0?'bad':after<b.lim*.2?'warn':'');
    el.textContent=a>0?(after>=0?`Danach noch ${eur(after)} von ${eur0(b.lim)} übrig`:`Damit ${eur(-after)} über Budget`):(b.left>=0?`Budget: noch ${eur(b.left)} von ${eur0(b.lim)} übrig`:`Budget schon ${eur(-b.left)} überzogen`)};
  const upd=()=>{const a=$('#amt');if(a)a.textContent=(st.type==='in'?'+ ':'')+(st.amt||'0')+' €';updB()};
  root.onclick=ev=>{const b=ev.target.closest('button');if(!b||b.dataset.act)return;
    if(b.dataset.ty){const n=st.amt,nt=$('#note').value;st.type=b.dataset.ty;st.cat=st.type==='in'?'Gehalt':(ls('fin.lastCat')||cats()[0][1]);if(!forTouched)st.forMonth=autoFor();draw();st.amt=n;$('#note').value=nt;upd();return}
    if(b.dataset.for){forTouched=true;st.forMonth=b.dataset.for;root.querySelectorAll('[data-for]').forEach(x=>x.classList.toggle('on',x===b));return}
    if(b.dataset.who!=null){who=b.dataset.who;root.querySelectorAll('[data-who]').forEach(x=>x.classList.toggle('on',x===b));return}
    if(b.dataset.cat){st.cat=b.dataset.cat;root.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('on',x===b));updB();
      if(st.type==='in'&&!forTouched){st.forMonth=autoFor();root.querySelectorAll('[data-for]').forEach(x=>x.classList.toggle('on',x.dataset.for===st.forMonth))}return}
    if(b.dataset.k){let a=st.amt;const k=b.dataset.k;
      if(k==='⌫')a=a.slice(0,-1);else if(k===','){if(!a.includes(','))a=(a||'0')+','}
      else{if(a.includes(',')&&a.split(',')[1].length>=2)return;if(a==='0')a='';if(a.replace(',','').length>=7)return;a+=k}
      st.amt=a;upd();return}
    if(b.id==='del'){if(confirm('Wirklich löschen?')){remove(type==='in'?'incomes':'expenses',id);onDone(null)}return}
    if(b.id==='save'){const amount=num(st.amt);if(!(amount>0)){$('#amt').classList.add('shake');setTimeout(()=>$('#amt')?.classList.remove('shake'),350);toast('Betrag fehlt');return}
      if(!st.cat){const cs=$('#cats');cs.classList.add('shake');setTimeout(()=>cs.classList.remove('shake'),350);toast('Bitte Kategorie wählen');return}
      const base={id:rec?.id||pre.newId||uid(),date:$('#date').value||todayISO(),amount,note:$('#note').value.trim(),who,createdAt:rec?.createdAt||now()};
      if(st.type==='in'){upsert('incomes',{...base,source:st.cat,forMonth:st.forMonth})}else{ls('fin.lastCat',st.cat);upsert('expenses',{...base,cat:st.cat})}
      onDone({...base,type:st.type,cat:st.cat})}};
  draw();
  root.onkeydown=null;}
function openEntry(type,id,pre){const root=openSheet('');root.classList.add('entry');entryForm(root,{type,id,pre},r=>{closeSheet();if(r&&pre&&pre.inbox)inboxDone(pre.inbox);if(r&&pre&&pre.wishId)wishBought(pre.wishId);if(r){const bl=r.type==='in'?'':budgetLine(r.date.slice(0,7),r.cat);toast(r.type==='in'?'Einnahme gespeichert ✓':bl?`Gespeichert · ${bl}`:`Gespeichert · noch ${eur(calc(curMonth).avail)} frei`)}})}

function openRec(id,pre={}){
  const r=id?data.recurring.find(x=>x.id===id):null;
  const v=r||{name:pre.name||'',amount:'',interval:pre.iv||'monthly',every:'',start:todayYM()+'-01',end:'',cat:pre.cat||'Sonstiges',kind:'out',note:'',forWhom:'Alle'};
  const root=openSheet(`<h3>${r?'Bearbeiten':'Neu: regelmäßige Zahlung'}</h3>
  <div class="seg" id="rKind"><button data-k="out" class="${v.kind!=='in'?'on':''}">Ausgabe</button><button data-k="in" class="${v.kind==='in'?'on':''}">Einnahme</button></div>
  <label class="f">Name<input id="rName" value="${esc(v.name)}" placeholder="z. B. Kfz-Versicherung"></label>
  <div class="two"><label class="f" style="margin:0">Betrag (€)<input id="rAmt" inputmode="decimal" value="${v.amount!==''?String(v.amount).replace('.',','):''}"></label>
  <label class="f" style="margin:0">Wie oft?<select id="rInt">${Object.entries(IV).map(([k,[,l]])=>`<option value="${k}" ${k===v.interval?'selected':''}>${l}</option>`).join('')}<option value="custom" ${v.interval==='custom'?'selected':''}>eigener Wert …</option></select></label></div>
  <label class="f" id="rEveryL" style="margin-top:10px">Alle wie viele Monate?<input id="rEvery" type="number" inputmode="numeric" min="1" max="120" value="${esc(v.every||'')}" placeholder="z. B. 2"></label>
  <div class="mini" style="margin:10px 0 4px" id="rForL">Gehört zu</div><div class="chips" id="rFor">${['Alle',...members()].map(m=>`<button class="chip ${m===(v.forWhom||'Alle')?'on':''}" data-fw="${esc(m)}">${m==='Alle'?'👨‍👩‍👦 Alle':esc(m)}</button>`).join('')}</div>
  <label class="f" style="margin-top:10px"><span id="rStartL"></span><input type="date" id="rStart" value="${v.start}"></label><div class="hint" id="rHint"></div>
  <label class="f">Endet nach Monat (optional)<input type="month" id="rEnd" value="${esc(v.end||'')}"></label><div class="hint">Z. B. wenn ein Kredit ausläuft oder ein Vertrag gekündigt ist.</div>
  <label class="f" id="rCatL">Kategorie<select id="rCat">${REC_CATS.map(c=>`<option ${c===v.cat?'selected':''}>${c}</option>`).join('')}</select></label>
  <label class="f">Notiz<input id="rNote" value="${esc(v.note||'')}" placeholder="optional, z. B. Vertragsnummer-Hinweis"></label>
  <div class="btns">${r?'<button class="btn ghost danger" id="rDel">Löschen</button>':''}<button class="btn" id="rSave">Speichern</button></div>`);
  let kind=v.kind||'out';
  let forWhom=v.forWhom||'Alle';
  $('#rFor').onclick=e=>{const b=e.target.closest('[data-fw]');if(!b)return;forWhom=b.dataset.fw;$('#rFor').querySelectorAll('[data-fw]').forEach(x=>x.classList.toggle('on',x===b))};
  const hint=()=>{const iv=$('#rInt').value;$('#rEveryL').style.display=iv==='custom'?'':'none';$('#rStartL').textContent=iv==='once'?'Wann fällig?':iv==='monthly'?'Abbuchungstag (ab diesem Monat)':'Datum einer Abbuchung';
    $('#rHint').textContent=iv==='once'?'Zählt voll in diesem Monat.':iv==='monthly'?'Der Tag zählt für jeden Monat. Ab dem Monat des Datums wird gerechnet.':'Am besten die nächste oder letzte Abbuchung – daraus berechnet die App alle weiteren Termine und wie viel du monatlich zurücklegen solltest.';
    $('#rCatL').style.display=kind==='in'?'none':''};
  $('#rInt').onchange=hint;hint();
  $('#rKind').onclick=e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;$('#rKind').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));hint()};
  $('#rSave').onclick=()=>{const name=$('#rName').value.trim(),amount=num($('#rAmt').value);
    const miss=[];if(!name)miss.push('rName');if(!(amount>0))miss.push('rAmt');const iv=$('#rInt').value,every=parseInt($('#rEvery').value,10);if(iv==='custom'&&!(every>=1))miss.push('rEvery');
    document.querySelectorAll('.missing').forEach(x=>x.classList.remove('missing'));if(miss.length){miss.forEach(id=>$('#'+id).classList.add('missing'));toast('Bitte die rot markierten Felder ausfüllen');return}
    upsert('recurring',{id:r?.id||uid(),name,amount,interval:iv,every:iv==='custom'?every:'',forWhom,start:$('#rStart').value||todayISO(),end:$('#rEnd').value||'',cat:kind==='in'?'Einnahme':$('#rCat').value,kind,note:$('#rNote').value.trim(),who:r?.who||cfg.me||'',createdAt:r?.createdAt||now()});closeSheet();toast('Gespeichert ✓')};
  if(r)$('#rDel').onclick=()=>{if(confirm(`„${r.name}“ löschen?`)){remove('recurring',r.id);closeSheet()}}}

const debtHist=(x,b)=>{const h=(x&&Array.isArray(x.hist)?x.hist:[]).filter(e=>e.m!==todayYM());h.push({m:todayYM(),b});return h.slice(-36)};
function openDebt(id){
  const d=id?data.debts.find(x=>x.id===id):null;const v=d||{name:'',balance:'',rate:'',payment:''};const f=x=>x===''||x==null?'':String(x).replace('.',',');
  openSheet(`<h3>${d?'Schuld bearbeiten':'Neue Schuld / Kredit'}</h3>
  <label class="f">Name<input id="dName" value="${esc(v.name)}" placeholder="z. B. Dispo, Ratenkredit"></label>
  <div class="two"><label class="f" style="margin:0">Restschuld (€)<input id="dBal" inputmode="decimal" value="${f(v.balance)}"></label><label class="f" style="margin:0">Zinssatz (%)<input id="dRate" inputmode="decimal" value="${f(v.rate)}"></label></div>
  <label class="f" style="margin-top:10px">Monatliche Rate (€)<input id="dPay" inputmode="decimal" value="${f(v.payment)}" placeholder="0 bei Dispo"></label>
  <div class="hint">Die Rate selbst bitte zusätzlich unter „Fixkosten“ eintragen – hier geht’s nur um Restschuld und Tilgungsplan.</div>
  <div class="btns">${d?'<button class="btn ghost danger" id="dDel">Löschen</button>':''}<button class="btn" id="dSave">Speichern</button></div>`);
  $('#dSave').onclick=()=>{const name=$('#dName').value.trim();if(!name){toast('Name fehlt');return}const bal=$('#dBal').value.trim();
    upsert('debts',{id:d?.id||uid(),name,balance:bal===''?null:num(bal),rate:num($('#dRate').value),payment:num($('#dPay').value),createdAt:d?.createdAt||now(),hist:bal===''?(d?.hist||[]):debtHist(d,num(bal))});closeSheet()};
  if(d)$('#dDel').onclick=()=>{if(confirm('Löschen?')){remove('debts',d.id);closeSheet()}}}

/* ---------- Aktionen ---------- */
const ACT={
  bell:()=>setPush(!pushOn()),
  lang:d=>setLang(d.l),
  syncInfo:()=>toast(({ok:'🟢 Alles synchron – ihr seht alle denselben Stand',busy:'🟠 Synchronisiere gerade …',err:'🔴 Sync-Problem: '+syncMsg,local:'⚪️ Nicht verbunden – Daten nur auf diesem Handy'})[syncState]),
  who:d=>{listWho=d.p||'';render()},
  nav:d=>{view=d.v;if(d.t){planTab=d.t;ls('fin.planTab',planTab)}window.scrollTo(0,0);render()},
  prevM:()=>{if(curMonth<=startMonth()){toast('Davor gibt’s noch keine Daten 🐼');return}curMonth=ymOf(mi(curMonth)-1);render()},
  nextM:()=>{curMonth=ymOf(mi(curMonth)+1);render()},
  add:d=>openEntry(d.t||'out'),
  planTab:d=>{planTab=d.t;ls('fin.planTab',planTab);render()},
  addWish:()=>openWish(null),
  editWish:d=>openWish(d.id),
  inboxBook:d=>{const x=inbox.find(i=>i.name===d.id);if(!x)return;openEntry('out',null,{amt:x.amount?String(x.amount).replace('.',','):'',note:x.merchant,date:x.date,who:x.who,newId:inboxId(x.name),pickCat:true,inbox:x.name})},
  inboxSkip:d=>{if(confirm('Diese Zahlung ignorieren? Sie wird nicht gebucht.')){inboxDone(d.id);toast('Zahlung ignoriert')}},
  editExp:d=>openEntry('out',d.id),
  budgets:d=>openBudgets(d.cat),
  editIn:d=>openEntry('in',d.id),
  addRec:d=>openRec(null,{name:d.name,iv:d.iv,cat:d.cat}),
  editRec:d=>openRec(d.id),
  editDebt:d=>openDebt(d.id||null),
  close:()=>closeSheet(),
  syncNow:()=>sync().then(()=>toast(syncState==='ok'?'Synchron ✓':syncText())),
  copyCode:()=>copy(setupCode()),
  claude:()=>copy(claudeText()),
  copyLink:()=>copy(location.href.split('#')[0].split('?')[0].replace(/neu\.html$/,'')+'#setup='+encodeURIComponent(setupCode())),
  export:()=>{const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`finanzen-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove()},
  wipe:()=>{if(confirm('Alle Daten auf DIESEM Gerät löschen? (Daten auf GitHub bleiben erhalten)')){localStorage.removeItem('fin.data');localStorage.removeItem('fin.cfg');location.reload()}}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t)}});

/* ---------- Schnell-Eintrag (Home-Bildschirm / Kurzbefehl) ---------- */
function quickScreen(pre={}){_cc={};
  document.body.classList.add('quick');$('#hdr').style.display='none';$('#nav').style.display='none';
  const v=$('#view');v.className='qwrap';v.style.padding='14px 16px';
  const needCon=!hasRemote(),needMe=!cfg.me&&people().length>1;
  if(needCon||needMe){v.innerHTML=`<div class="card" style="margin-top:10px"><h3>🐼 Kurz einrichten</h3>
    ${needCon?`<p class="sub" style="margin:0 0 8px">Füge den Verbindungscode aus der App ein (dort ⚙︎ → „Code kopieren“).</p><div class="two"><input class="inp" id="qCode" placeholder="Code einfügen" autocapitalize="off" autocorrect="off"><button class="btn small" id="qApply" style="flex:none">OK</button></div>`
    :`<p class="sub" style="margin:0 0 10px">Wer bist du auf diesem Handy?</p><div class="btns">${people().map(p=>`<button class="btn" data-me="${esc(p)}">${esc(p)}</button>`).join('')}</div>`}</div>`;
    v.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.id==='qApply'){if(applyCode($('#qCode').value)){toast('Verbunden ✓');v.innerHTML='<div class="empty">Lade eure Daten …</div>';sync().then(()=>quickScreen(pre))}else toast('Code ungültig')}
      if(b.dataset.me){cfg.me=b.dataset.me;saveCfg();quickScreen(pre)}};
    return}
  entryForm(v,{type:pre.type||'out',pre},r=>{const c=calc(todayYM());
    const isIn=r&&r.type==='in';const bi=!isIn&&r?budgetInfo(r.date.slice(0,7),r.cat):null,bl=!isIn&&r?budgetLine(r.date.slice(0,7),r.cat):'';
    const why=!isIn&&r?(dumbReason(live(data.expenses).find(x=>x.id===r.id),c)||(bi&&bi.left<0&&bi.left+r.amount>=0?`${r.cat}-Budget geknackt! Kiko ist enttäuscht. 😤`:'')):'';const md=isIn?'happy':why||c.avail<0?'angry':moniState(c)[0];
    v.innerHTML=`<div class="done"><div class="moni ${md}" style="display:inline-block">${moniSVG(md,110)}</div>${why||isIn?`<div class="bubble" style="display:inline-block;margin-bottom:10px">${esc(isIn?'Geld rein! So mag ich das. 🤑':why)}</div>`:''}<h3>${isIn?'Einnahme':'Ausgabe'} gespeichert ✓</h3><p class="sub">Noch verfügbar diesen Monat:</p><div style="font-size:34px;font-weight:700;${c.avail<0?'color:var(--bad)':''}">${eur(c.avail)}</div>${bl?`<div class="bhint ${bi.left<0?'bad':bi.left<bi.lim*.2?'warn':''}" style="display:inline-block;margin:12px 0 0">${esc(bl)}</div>`:''}
    <div class="btns" style="margin-top:24px"><button class="btn ghost" id="qMore">Noch eine</button><a class="btn" style="text-decoration:none;display:block" href="./">Zur App</a></div><p class="mini" id="qSync" style="margin-top:14px"></p></div>`;
    $('#qMore').onclick=()=>quickScreen();const upd=()=>{const e=$('#qSync');if(e)e.textContent=syncText()};upd();setTimeout(upd,1500);setTimeout(upd,4000)})}

function askSalary(){
  const m=salaryDueMonth();if(!m||!live(data.incomes).length&&!live(data.recurring).length&&!live(data.expenses).length)return;
  if(hasSalary(m)||ls('fin.salAsk')===todayISO()||!$('#sheet').classList.contains('hidden'))return;
  openSheet(`<div style="text-align:center"><div class="moni happy" style="display:inline-block">${moniSVG('happy',96)}</div>
  <h3 style="margin-top:6px">Ist dein Gehalt schon da? 💶</h3><p class="sub" style="margin:0 0 14px">Trag ein, was wirklich auf dem Konto gelandet ist. Dann rechnet die App für ${MONTHS[+m.slice(5)-1]} mit echtem Geld statt mit einer Schätzung.</p></div>
  <div class="btns"><button class="btn ghost" data-act="salLater">Noch nicht</button><button class="btn in" data-act="salNow" data-m="${m}">Jetzt eintragen</button></div>`)}
ACT.addSal=d=>openEntry('in',null,{cat:'Gehalt',forMonth:d.m});
ACT.salLater=()=>{ls('fin.salAsk',todayISO());closeSheet();toast('Okay, Kiko fragt morgen nochmal 🐼')};
ACT.salNow=d=>{ls('fin.salAsk',todayISO());closeSheet();openEntry('in',null,{cat:'Gehalt',forMonth:d.m})};
function askCarry(){
  if(!$('#sheet').classList.contains('hidden'))return;const p=ymOf(mi(todayYM())-1),b=baseMonth();if(!b||p<b||carryDecision(p))return;
  const a=calc(p).avail,pn=MONTHS[+p.slice(5)-1],cn=MONTHS[+todayYM().slice(5)-1];if(Math.abs(a)<1)return;
  if(a<0){openSheet(`<div style="text-align:center"><div class="moni worried" style="display:inline-block">${moniSVG('worried',96)}</div><h3 style="margin-top:6px">Im ${pn} wart ihr ${eur(-a)} drüber</h3><p class="sub" style="margin:0 0 14px">Das Geld ist echt weg (wahrscheinlich im Dispo). Kiko zieht es deshalb vom ${cn} ab, damit die Zahlen ehrlich bleiben.</p></div><button class="btn" data-act="carryPick" data-c="minus" data-p="${p}">Verstanden</button>`);return}
  const debts=live(data.debts).filter(d=>(+d.balance||0)>0).sort((x,y)=>y.rate-x.rate);const top=debts[0];
  openSheet(`<div style="text-align:center"><div class="moni happy" style="display:inline-block">${moniSVG('happy',96)}</div><h3 style="margin-top:6px">${eur(a)} übrig im ${pn}! 🎉</h3><p class="sub" style="margin:0 0 14px">Stark! Wohin damit?</p></div>
  ${top?`<button class="btn" data-act="carryPick" data-c="debt" data-p="${p}" data-d="${top.id}" style="margin-bottom:8px">🏦 ${esc(top.name)} tilgen<br><small style="font-weight:400;opacity:.85">spart ca. ${eur(a*top.rate/100)} Zinsen pro Jahr · Kikos Tipp</small></button>`:''}
  <button class="btn ghost" data-act="carryPick" data-c="reserve" data-p="${p}" style="margin-bottom:8px">🏦 Auf die Rücklage legen</button>
  <button class="btn ghost" data-act="carryPick" data-c="carry" data-p="${p}">⤴️ In den ${cn} mitnehmen</button>`)}
ACT.carryPick=d=>{const p=d.p,a=calc(p).avail;
  upsert('carries',{id:'carry-'+p,month:p,choice:d.c,amount:Math.round(a*100)/100,debtId:d.d||'',who:cfg.me||''});
  if(d.c==='debt'){const x=data.debts.find(y=>y.id===d.d);if(x){const nb=Math.max(0,Math.round((x.balance-a)*100)/100);upsert('debts',{...x,balance:nb,hist:debtHist(x,nb)});toast(`${esc(x.name)}: Restschuld jetzt ${eur(Math.max(0,x.balance))} – überweis die ${eur(a)} noch in der Bank!`)}}
  else if(d.c==='reserve')toast(`Überweis die ${eur(a)} noch aufs Rücklagen-Konto 🐼`);
  else if(d.c==='carry')toast(`${eur(a)} sind im neuen Monat dabei`);
  closeSheet()};
function askMe(){if(cfg.me||people().length<2||!$('#sheet').classList.contains('hidden'))return;openSheet(`<h3>Wer bist du? 👋</h3><p class="sub">Damit deine Buchungen deinen Namen bekommen. Kannst du später unter ⚙︎ ändern.</p><div class="seg" style="margin:12px 0 0"><button data-act="lang" data-l="de" class="${!EN()?'on':''}">🇩🇪 Deutsch</button><button data-act="lang" data-l="en" class="${EN()?'on':''}">🇬🇧 English</button></div><div class="btns" style="margin-top:14px">${people().map(p=>`<button class="btn" data-act="setMe" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>`)}
ACT.setMe=d=>{cfg.me=d.p;saveCfg();closeSheet();toast('Hallo '+d.p+'!');render()};
/* ---------- Start ---------- */
(function init(){document.documentElement.lang=cfg.lang||'de';
  // Normale iPhones (nicht iPhone Duo / iPad) nur im Hochformat: screen-Maße ändern sich beim Drehen nicht
  if(Math.min(screen.width,screen.height)<=440&&matchMedia('(pointer:coarse)').matches)document.documentElement.classList.add('phone');
  $('#rotKiko').innerHTML=moniSVG('worried',96);trNode(document.body);
  const h=location.hash;
  if(h.startsWith('#setup=')){const ok=applyCode(decodeURIComponent(h.slice(7)));history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>toast(ok?'Mit GitHub verbunden ✓':'Setup-Link ungültig'),300)}
  const q=new URLSearchParams(location.search);
  const pre={};if(q.get('betrag'))pre.amt=String(num(q.get('betrag'))).replace('.',',');if(q.get('kat'))pre.cat=q.get('kat');if(q.get('notiz'))pre.note=q.get('notiz');if(q.get('typ')==='ein'||q.get('typ')==='in')pre.type='in';
  // Kurzbefehl mit Betrag + Kategorie → direkt speichern
  if(pre.amt&&pre.cat&&q.get('direkt')!=='0'){const type=pre.type||'out';const base={id:uid(),date:todayISO(),amount:num(pre.amt),note:pre.note||'',who:cfg.me||'',createdAt:now(),updatedAt:now()};
    if(type==='in')data.incomes.push({...base,source:pre.cat});else data.expenses.push({...base,cat:pre.cat});saveLocal();history.replaceState(null,'',location.pathname);
    quickScreen();const c=calc(todayYM());$('#view').innerHTML=`<div class="done"><div class="chk">✓</div><h3>${eur(base.amount)} · ${esc(pre.cat)}</h3><p class="sub">Noch verfügbar diesen Monat:</p><div style="font-size:34px;font-weight:700">${eur(c.avail)}</div><div class="btns" style="margin-top:24px"><a class="btn" style="text-decoration:none;display:block" href="./">Zur App</a></div><p class="mini" id="qSync"></p></div>`;
    sync().then(()=>{const e=$('#qSync');if(e)e.textContent=syncText()});return}
  if(!QUICK&&people().length>1&&!cfg.me)setTimeout(askMe,400);
  if(!QUICK){setTimeout(askCarry,800);setTimeout(askSalary,1100)}
  if(QUICK||pre.amt||q.get('neu')!=null){if(q.toString())history.replaceState(null,'',location.pathname);quickScreen(pre)}else render();
  sync();
  setInterval(()=>{if(document.visibilityState==='visible'&&!document.querySelector('#sheet:not(.hidden)'))sync()},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){sync();if(!QUICK)setTimeout(askSalary,600)}});
  if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
